<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#fff7fb">
<title>ゆみへ送るメッセージ</title>
<style>
:root {
  --bg:#fff7fb; --card:#fff; --text:#28222a; --muted:#776f78;
  --pink:#db2777; --pink2:#fce7f3; --violet:#7c3aed; --line:#eadde5;
  --green:#15803d;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text)}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Sans","Noto Sans JP",sans-serif}
.app{max-width:760px;margin:0 auto;padding:12px 10px 56px}
.hero,.card{
  background:var(--card);border:1px solid var(--line);border-radius:20px;
  box-shadow:0 8px 28px rgba(131,24,67,.07)
}
.hero{padding:17px;margin:4px 0 13px;background:linear-gradient(135deg,#fce7f3,#f5f3ff)}
.hero h1{font-size:20px;margin:0 0 7px}
.hero p{font-size:12px;line-height:1.65;color:var(--muted);margin:0}
.badge{display:inline-block;margin-top:9px;padding:5px 9px;border-radius:999px;background:#fff;color:#9d174d;font-size:11px;font-weight:700}
.card{padding:14px;margin:12px 0}
.title{font-weight:800;font-size:16px;margin-bottom:4px}
.sub{font-size:11px;color:var(--muted);margin-bottom:9px}
.searchrow{display:grid;grid-template-columns:minmax(0,1fr) 54px;gap:7px}
input{
  width:100%;min-height:50px;border:2px solid #f1c7d9;border-radius:13px;
  padding:11px 12px;font-size:16px;outline:none;background:#fff;color:#222
}
input:focus{border-color:var(--pink);box-shadow:0 0 0 3px rgba(219,39,119,.08)}
.showbtn{border:0;border-radius:13px;background:var(--pink2);color:#9d174d;font-size:18px;font-weight:900}
.suggest{
  display:none;margin-top:7px;border:1px solid var(--line);border-radius:14px;
  max-height:290px;overflow:auto;-webkit-overflow-scrolling:touch;background:#fff
}
.suggest.open{display:block}
.shead{
  position:sticky;top:0;z-index:2;background:#fff7fb;color:var(--muted);
  padding:8px 11px;font-size:11px;border-bottom:1px solid var(--line)
}
.opt{padding:11px 12px;font-size:14px;line-height:1.5;border-bottom:1px solid #f6eef2}
.opt:last-child{border-bottom:0}
.opt:active{background:#fff0f6}
.empty{padding:15px;text-align:center;color:var(--muted);font-size:12px}
.selected{
  margin-top:8px;padding:9px 11px;background:#fdf2f8;border-radius:11px;
  font-size:12px;color:#9d174d;line-height:1.5
}
.resultcard{background:linear-gradient(135deg,#faf5ff,#fff1f7);border-color:#dfc9f5}
textarea{
  width:100%;min-height:142px;border:2px solid #d8c2ef;border-radius:14px;
  padding:13px;font-size:17px;line-height:1.7;background:#fff;color:#222;resize:vertical
}
.actions{display:grid;grid-template-columns:1.25fr .75fr;gap:8px;margin-top:10px}
button.action{min-height:50px;border:0;border-radius:14px;font-size:15px;font-weight:800}
.copy{background:var(--violet);color:#fff}
.random{background:#f3e8ff;color:#6d28d9}
.status{min-height:20px;margin-top:7px;text-align:center;font-size:12px}
.note{font-size:11px;color:var(--muted);line-height:1.6;margin-top:8px}
@media(max-width:520px){
  .app{padding:8px 8px 40px}
  .actions{grid-template-columns:1fr}
  .hero h1{font-size:19px}
}
</style>
</head>
<body>
<div class="app">
  <section class="hero">
    <h1>💗 ゆみへ送るメッセージ</h1>
    <p>LINE履歴から確認できた三浦さんの口調に合わせた版です。短め・直接的・❤️多め、たまに🤣で重さを抜く言い方に寄せています。</p>
    <span class="badge">三浦さん口調版 10,000 × 10,000</span>
  </section>

  <section class="card" id="loveCard">
    <div class="title">① 愛のメッセージ</div>
    <div class="sub">邦楽由来のテーマを、普段のLINE口調へ変換した10,000件</div>
    <div class="searchrow">
      <input id="loveInput" type="text" autocomplete="off" placeholder="例：好き、大事、ずっと、笑顔">
      <button id="loveShow" class="showbtn" type="button">▼</button>
    </div>
    <div id="loveSuggest" class="suggest"></div>
    <div id="loveSelected" class="selected">まだ選択されていません</div>
  </section>

  <section class="card" id="meetCard">
    <div class="title">② 会いたいフレーズ</div>
    <div class="sub">会いたい気持ちを、普段のLINE口調へ変換した10,000件</div>
    <div class="searchrow">
      <input id="meetInput" type="text" autocomplete="off" placeholder="例：会いたい、顔、ぎゅー、声、隣">
      <button id="meetShow" class="showbtn" type="button">▼</button>
    </div>
    <div id="meetSuggest" class="suggest"></div>
    <div id="meetSelected" class="selected">まだ選択されていません</div>
  </section>

  <section class="card resultcard">
    <div class="title">③ 完成メッセージ</div>
    <div class="sub">LINEっぽく2行で自然につなげます</div>
    <textarea id="result" readonly placeholder="上と下を選ぶと、ここに完成文が入ります"></textarea>
    <div class="actions">
      <button id="copyBtn" class="action copy" type="button">📋 クリップボードへコピー</button>
      <button id="randomBtn" class="action random" type="button">🎲 ランダム</button>
    </div>
    <div id="status" class="status"></div>
    <div class="note">候補は10,000件全部を一度に表示せず、検索結果を最大80件だけ表示するのでiPhoneでも軽く使える設計です。</div>
  </section>
</div>

  }else{
    result.value=selectedLove||selectedMeet||"";
  }
  status.textContent="";
}

function setLove(v){
  selectedLove=v||"";
  loveInput.value=selectedLove;
  loveSelected.textContent=selectedLove ? "選択中："+selectedLove : "まだ選択されていません";
  loveSuggest.classList.remove("open");
  makeResult();
}

function setMeet(v){
  selectedMeet=v||"";
  meetInput.value=selectedMeet;
  meetSelected.textContent=selectedMeet ? "選択中："+selectedMeet : "まだ選択されていません";
  meetSuggest.classList.remove("open");
  makeResult();
}

function renderSuggestions(input,box,options,picker){
  var q=norm(input.value);
  var found=[];
  var i;
  for(i=0;i<options.length && found.length<80;i++){
    if(!q || norm(options[i]).indexOf(q)!==-1){
      found.push(options[i]);
    }
  }
  box.innerHTML="";

  var head=document.createElement("div");
  head.className="shead";
  head.textContent=q ? "検索結果（最大80件）" : "おすすめ候補（先頭80件）";
  box.appendChild(head);

  if(found.length===0){
    var emp=document.createElement("div");
    emp.className="empty";
    emp.textContent="一致する候補がありません";
    box.appendChild(emp);
  }else{
    for(i=0;i<found.length;i++){
      (function(txt){
        var d=document.createElement("div");
        d.className="opt";
        d.textContent=txt;
        d.onclick=function(){picker(txt);};
        box.appendChild(d);
      })(found[i]);
    }
  }
  box.classList.add("open");
}

loveInput.oninput=function(){
  selectedLove="";
  loveSelected.textContent="検索中／未選択";
  makeResult();
  renderSuggestions(loveInput,loveSuggest,loveOptions,setLove);
};
meetInput.oninput=function(){
  selectedMeet="";
  meetSelected.textContent="検索中／未選択";
  makeResult();
  renderSuggestions(meetInput,meetSuggest,meetOptions,setMeet);
};

loveInput.onfocus=function(){
  renderSuggestions(loveInput,loveSuggest,loveOptions,setLove);
};
meetInput.onfocus=function(){
  renderSuggestions(meetInput,meetSuggest,meetOptions,setMeet);
};

document.getElementById("loveShow").onclick=function(){
  if(loveSuggest.classList.contains("open")) loveSuggest.classList.remove("open");
  else renderSuggestions(loveInput,loveSuggest,loveOptions,setLove);
};
document.getElementById("meetShow").onclick=function(){
  if(meetSuggest.classList.contains("open")) meetSuggest.classList.remove("open");
  else renderSuggestions(meetInput,meetSuggest,meetOptions,setMeet);
};

document.getElementById("randomBtn").onclick=function(){
  setLove(loveOptions[Math.floor(Math.random()*loveOptions.length)]);
  setMeet(meetOptions[Math.floor(Math.random()*meetOptions.length)]);
};

function fallbackCopy(text){
  var ta=document.createElement("textarea");
  ta.value=text;
  ta.style.position="fixed";
  ta.style.left="-9999px";
  document.body.appendChild(ta);
  ta.focus();
  ta.select();
  var ok=false;
  try{ok=document.execCommand("copy");}catch(e){ok=false;}
  document.body.removeChild(ta);
  return ok;
}

document.getElementById("copyBtn").onclick=function(){
  var text=result.value.trim();
  if(!text){
    status.style.color="#b45309";
    status.textContent="先に2つのメッセージを選んでね";
    return;
  }
  if(navigator.clipboard && window.isSecureContext){
    navigator.clipboard.writeText(text).then(function(){
      status.style.color="#15803d";
      status.textContent="✓ コピーしたよ❤️";
    }).catch(function(){
      var ok=fallbackCopy(text);
      status.style.color=ok?"#15803d":"#b45309";
      status.textContent=ok?"✓ コピーしたよ❤️":"コピーできませんでした。完成文を長押ししてコピーしてね";
    });
  }else{
    var ok=fallbackCopy(text);
    status.style.color=ok?"#15803d":"#b45309";
    status.textContent=ok?"✓ コピーしたよ❤️":"コピーできませんでした。完成文を長押ししてコピーしてね";
  }
};

document.addEventListener("click",function(e){
  if(!document.getElementById("loveCard").contains(e.target)) loveSuggest.classList.remove("open");
  if(!document.getElementById("meetCard").contains(e.target)) meetSuggest.classList.remove("open");
});

})();
</script>
</body>
</html>
