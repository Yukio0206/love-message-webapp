<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#fff7fb">
<title>愛のメッセージ セレクター v2</title>
<style>
:root {
  --bg:#fff7fb; --card:#fff; --text:#262129; --muted:#746c76;
  --pink:#db2777; --pink2:#ec4899; --violet:#7c3aed; --line:#eadde5;
  --shadow:0 8px 28px rgba(131,24,67,.08);
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text)}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Sans","Noto Sans JP",sans-serif}
.app{max-width:780px;margin:0 auto;padding:16px 12px 60px}
.header,.card{background:var(--card);border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow)}
.header{padding:18px;background:linear-gradient(135deg,#fce7f3,#f5f3ff);margin-bottom:14px}
.header h1{font-size:21px;margin:0 0 8px}
.header p{font-size:13px;line-height:1.65;color:var(--muted);margin:0}
.card{padding:15px;margin:14px 0}
.label{font-size:16px;font-weight:800;margin-bottom:4px}
.count{font-size:12px;color:var(--muted);margin-bottom:9px}
.combo{position:relative}
.combo-line{display:grid;grid-template-columns:minmax(0,1fr) 52px 62px;gap:7px}
.combo input{
  width:100%;min-width:0;border:2px solid #f1c7d9;border-radius:13px;
  padding:13px;font-size:16px;outline:none;background:#fff
}
.combo input:focus{border-color:var(--pink);box-shadow:0 0 0 3px rgba(219,39,119,.09)}
.arrow-btn,.clear-btn{
  border:0;border-radius:13px;font-size:16px;min-height:49px;cursor:pointer
}
.arrow-btn{background:#fce7f3;color:#9d174d;font-weight:900}
.clear-btn{background:#f3f4f6;color:#4b5563;font-size:13px}
.menu{
  display:none;position:absolute;z-index:100;left:0;right:0;top:57px;
  max-height:330px;overflow-y:auto;-webkit-overflow-scrolling:touch;
  border:1px solid var(--line);border-radius:15px;background:#fff;
  box-shadow:0 14px 40px rgba(0,0,0,.17)
}
.menu.show{display:block}
.opt{padding:12px 13px;border-bottom:1px solid #f5edf2;font-size:14px;line-height:1.5;cursor:pointer}
.opt:last-child{border-bottom:0}
.opt:active,.opt:hover{background:#fff0f6}
.menu-head{position:sticky;top:0;background:#fff7fb;border-bottom:1px solid var(--line);padding:8px 12px;font-size:12px;color:var(--muted);z-index:1}
.empty{padding:18px;text-align:center;color:var(--muted);font-size:13px}
.help{font-size:12px;color:var(--muted);margin-top:8px;line-height:1.5}
.result-card{background:linear-gradient(135deg,#faf5ff,#fff1f7);border-color:#dfc9f5}
.result-title{font-weight:800;color:#6d28d9;margin-bottom:10px}
#result{
  width:100%;min-height:140px;resize:vertical;border:1px solid #d8c2ef;
  border-radius:14px;padding:14px;font-size:17px;line-height:1.7;background:#fff;color:var(--text)
}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:11px}
.btn{min-height:50px;border:0;border-radius:14px;font-size:16px;font-weight:800;cursor:pointer}
.copy{background:var(--violet);color:#fff}
.random{background:#f3e8ff;color:#6d28d9}
.status{min-height:22px;text-align:center;margin-top:8px;font-size:13px}
.notice{font-size:11px;color:var(--muted);line-height:1.6;margin-top:8px}
@media(max-width:520px){
  .app{padding:10px 8px 40px}
  .header h1{font-size:19px}
  .combo-line{grid-template-columns:minmax(0,1fr) 50px 58px}
  .actions{grid-template-columns:1fr}
}
</style>
</head>
<body>
<noscript>
<div style="margin:12px;padding:14px;border-radius:12px;background:#fee2e2;color:#991b1b;font-family:sans-serif">
このページではJavaScriptが必要です。Safariの通常のWebページとして開いてください。
</div>
</noscript>
<div class="app">
  <section class="header">
    <h1>💗 愛のメッセージ × 会いたいフレーズ</h1>
    <p>▼を押すと候補が開きます。文字を入力すると10,000件から検索できます。選んだ2つは自動で1つの文章になります。</p>
  </section>

  <section class="card">
    <div class="label">① 邦楽から選ぶ 愛のメッセージ</div>
    <div class="count">10,000件</div>
    <div class="combo" id="loveCombo">
      <div class="combo-line">
        <input id="loveInput" type="text" autocomplete="off" placeholder="検索するか、▼を押して選択">
        <button id="loveArrow" class="arrow-btn" type="button" aria-label="候補を表示">▼</button>
        <button id="loveClear" class="clear-btn" type="button">消去</button>
      </div>
      <div id="loveMenu" class="menu"></div>
    </div>
    <div class="help">▼を押すと先頭100件を表示。検索語を入れると一致する候補を最大100件表示します。</div>
  </section>

  <section class="card">
    <div class="label">② 会いたいフレーズ</div>
    <div class="count">10,000件</div>
    <div class="combo" id="meetCombo">
      <div class="combo-line">
        <input id="meetInput" type="text" autocomplete="off" placeholder="検索するか、▼を押して選択">
        <button id="meetArrow" class="arrow-btn" type="button" aria-label="候補を表示">▼</button>
        <button id="meetClear" class="clear-btn" type="button">消去</button>
      </div>
      <div id="meetMenu" class="menu"></div>
    </div>
    <div class="help">例：「顔」「隣」「声」「ぎゅー」などで絞り込めます。</div>
  </section>

  <section class="card result-card">
    <div class="result-title">③ 完成したメッセージ</div>
    <textarea id="result" readonly placeholder="上と下を選ぶと、ここに完成メッセージが表示されます。"></textarea>
    <div class="actions">
      <button id="copyBtn" class="btn copy" type="button">📋 クリップボードへコピー</button>
      <button id="randomBtn" class="btn random" type="button">🎲 2つともランダム選択</button>
    </div>
    <div id="status" class="status"></div>
    <div class="notice">※ ブラウザの安全設定で自動コピーが禁止される場合は、完成文を長押しして「コピー」を選べます。</div>
  </section>
</div>

    menu.innerHTML = "";

    head.className = "menu-head";
    head.textContent = q ? "検索結果：最大100件を表示" : "先頭100件を表示（文字入力で検索）";
    menu.appendChild(head);

    if (found.length === 0) {
      var empty = document.createElement("div");
      empty.className = "empty";
      empty.textContent = "一致する候補がありません";
      menu.appendChild(empty);
    } else {
      for (i = 0; i < found.length; i++) {
        (function(txt) {
          var item = document.createElement("div");
          item.className = "opt";
          item.textContent = txt;
          item.addEventListener("click", function(ev) {
            ev.stopPropagation();
            picker(txt);
            menu.classList.remove("show");
          });
          menu.appendChild(item);
        })(found[i]);
      }
    }

    menu.classList.add("show");
  }

  function setLove(txt) {
    selectedLove = txt || "";
    if (selectedLove) loveInput.value = selectedLove;
    buildResult();
  }

  function setMeet(txt) {
    selectedMeet = txt || "";
    if (selectedMeet) meetInput.value = selectedMeet;
    buildResult();
  }

  loveInput.addEventListener("input", function() {
    selectedLove = "";
    buildResult();
    renderMenu(loveInput, loveMenu, loveOptions, setLove);
  });

  meetInput.addEventListener("input", function() {
    selectedMeet = "";
    buildResult();
    renderMenu(meetInput, meetMenu, meetOptions, setMeet);
  });

  loveInput.addEventListener("focus", function() {
    renderMenu(loveInput, loveMenu, loveOptions, setLove);
  });

  meetInput.addEventListener("focus", function() {
    renderMenu(meetInput, meetMenu, meetOptions, setMeet);
  });

  document.getElementById("loveArrow").addEventListener("click", function(ev) {
    ev.stopPropagation();
    if (loveMenu.classList.contains("show")) {
      loveMenu.classList.remove("show");
    } else {
      meetMenu.classList.remove("show");
      renderMenu(loveInput, loveMenu, loveOptions, setLove);
    }
  });

  document.getElementById("meetArrow").addEventListener("click", function(ev) {
    ev.stopPropagation();
    if (meetMenu.classList.contains("show")) {
      meetMenu.classList.remove("show");
    } else {
      loveMenu.classList.remove("show");
      renderMenu(meetInput, meetMenu, meetOptions, setMeet);
    }
  });

  document.getElementById("loveClear").addEventListener("click", function(ev) {
    ev.stopPropagation();
    loveInput.value = "";
    selectedLove = "";
    buildResult();
    renderMenu(loveInput, loveMenu, loveOptions, setLove);
  });

  document.getElementById("meetClear").addEventListener("click", function(ev) {
    ev.stopPropagation();
    meetInput.value = "";
    selectedMeet = "";
    buildResult();
    renderMenu(meetInput, meetMenu, meetOptions, setMeet);
  });

  document.getElementById("randomBtn").addEventListener("click", function() {
    var a = loveOptions[Math.floor(Math.random() * loveOptions.length)];
    var b = meetOptions[Math.floor(Math.random() * meetOptions.length)];
    setLove(a);
    setMeet(b);
    closeMenus();
  });

  document.getElementById("copyBtn").addEventListener("click", function() {
    var txt = result.value.trim();
    if (!txt) {
      status.style.color = "#b45309";
      status.textContent = "先に上と下のメッセージを選んでください";
      return;
    }

    function copied() {
      status.style.color = "#15803d";
      status.textContent = "✓ クリップボードへコピーしました";
    }

    function fallbackCopy() {
      var ta = document.createElement("textarea");
      ta.value = txt;
      ta.setAttribute("readonly", "");
      ta.style.position = "fixed";
      ta.style.left = "-9999px";
      document.body.appendChild(ta);
      ta.focus();
      ta.select();
      var ok = false;
      try {
        ok = document.execCommand("copy");
      } catch (e) {
        ok = false;
      }
      document.body.removeChild(ta);
      if (ok) {
        copied();
      } else {
        status.style.color = "#b45309";
        status.textContent = "自動コピーできません。完成文を長押ししてコピーしてください";
      }
    }

    if (navigator.clipboard && window.isSecureContext) {
      navigator.clipboard.writeText(txt).then(copied).catch(fallbackCopy);
    } else {
      fallbackCopy();
    }
  });

  document.addEventListener("click", function(ev) {
    if (!document.getElementById("loveCombo").contains(ev.target) &&
        !document.getElementById("meetCombo").contains(ev.target)) {
      closeMenus();
    }
  });

  buildResult();
})();
</script>
</body>
</html>
